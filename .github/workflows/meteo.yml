name: Meteo del giorno

on:
  schedule:
    # 06:52 UTC = 08:52 ora italiana estiva, da giugno a settembre.
    # Lo script controlla la Bacheca: nei giorni di chiusura non scrive nulla.
    - cron: '52 6 * 6-9 *'
  workflow_dispatch:

jobs:
  meteo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aggiorna le previsioni
        run: python3 meteo/aggiorna.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
